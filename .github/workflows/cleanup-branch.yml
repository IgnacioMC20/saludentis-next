name: Cleanup Branch

on:
  pull_request:
    types: [closed]
    branches:
      - dev
      - main

jobs:
  cleanup:
    name: Delete Merged Branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run if PR was merged (not just closed)
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete merged branch
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          
          # Prevent deletion of protected branches
          if [ "$BRANCH" = "dev" ] || [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            echo "⚠️  Skipping deletion of protected branch: $BRANCH"
            exit 0
          fi
          
          echo "🗑️  Deleting merged branch: $BRANCH"
          git push origin --delete "$BRANCH" || echo "⚠️  Branch already deleted or doesn't exist"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const protectedBranches = ['dev', 'main', 'master'];
            
            if (protectedBranches.includes(branch)) {
              return;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Branch \`${branch}\` has been automatically deleted after merge.`
            });
